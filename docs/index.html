<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chuyển đổi combo MTplus</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .vao { max-width: 560px; margin: 12vh auto; padding: 24px; font-family: var(--font-anthropic-sans); text-align: center; }
    .vao h1 { font-family: var(--font-anthropic-serif); font-weight: 400; }
    .vao a.nut { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 8px; background: var(--color-fg); color: var(--color-bg); text-decoration: none; font-weight: 600; }
    .vao p { color: var(--color-fg-muted); }
  </style>
</head>
<body>
  <main class="vao">
    <h1>Chuyển đổi combo MTplus</h1>
    <p>Dashboard đo lường MT30 &amp; CLB 100 tỷ: tổng quan tháng, đo lường tổng tuần, bảng tick chi tiết, báo cáo Zalo.</p>
    <a class="nut" id="mo" href="#">Mở dashboard</a>
    <p>Cần đăng nhập bằng tài khoản Google <b>mtplus.nuycorp@gmail.com</b>.</p>
  </main>
  <script src="config.js"></script>
  <script>
    const a = document.getElementById('mo');
    if (window.APP_URL) { a.href = window.APP_URL; if (!location.search.includes('o=1')) location.replace(window.APP_URL); }
    else a.textContent = 'Chưa cấu hình địa chỉ dashboard';
  </script>
</body>
</html>
